<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tech proof — Mapa de Tiendas</title>
<!-- Opened from file:// by tools/test/tech-proof.mjs. Proves the techniques documented in
     docs/TECH-NOTES.md: high-resolution PNG capture of a MapLibre map and fetch() to the
     public OSM services from an Origin: null page. -->
<link rel="stylesheet" href="../../../vendor/maplibre/maplibre-gl.css">
<style>
  body { margin: 0; font: 13px sans-serif; background: #eee; }
  /* Reference frame: 1000 units wide, aspect 7.75 x 6.5 in (the slide's map frame). */
  #map { width: 1000px; height: 839px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="../../../vendor/maplibre/maplibre-gl.js"></script>
<script>
  window.PROOF = {};
  const STYLE = 'https://tiles.openfreemap.org/styles/positron';

  // Generic helper: render a map off-screen-ish at pixelRatio and capture it.
  // method 'preserve' = canvasContextAttributes.preserveDrawingBuffer + toDataURL after idle.
  // method 'render'   = default context; after idle, triggerRepaint() and read the canvas
  //                     synchronously inside the next 'render' event (buffer still valid).
  PROOF.capture = function (method, pixelRatio, container) {
    return new Promise((resolve, reject) => {
      const t0 = performance.now();
      const map = new maplibregl.Map({
        container, style: STYLE,
        center: [-77.03, -12.115], zoom: 13.6,
        pixelRatio,
        interactive: false, attributionControl: false, fadeDuration: 0,
        canvasContextAttributes: { preserveDrawingBuffer: method === 'preserve', antialias: true },
      });
      map.on('error', (e) => reject(new Error('map error: ' + (e.error && e.error.message))));
      // 'render-es': same as 'render' but with Spanish labels preferred (see TECH-NOTES §1.3).
      if (method === 'render-es') map.once('styledata', () => PROOF.preferSpanish(map));
      map.once('idle', () => {
        const canvas = map.getCanvas();
        const finish = () => {
          try {
            const url = canvas.toDataURL('image/png');
            resolve({ method, pixelRatio, width: canvas.width, height: canvas.height, ms: Math.round(performance.now() - t0), url, blank: isBlank(canvas) });
          } catch (err) { reject(err); }
          map.remove();
        };
        if (method === 'preserve') finish();
        else { map.once('render', finish); map.triggerRepaint(); }
      });
    });
  };

  // Positron labels use ["coalesce", name_en, name]; in Peru OSM `name` is already Spanish and
  // name_en gives "Petit Thouars Avenue". Prefer name:es, then name.
  PROOF.preferSpanish = function (map) {
    for (const layer of map.getStyle().layers) {
      if (layer.type !== 'symbol') continue;
      const tf = map.getLayoutProperty(layer.id, 'text-field');
      if (tf && JSON.stringify(tf).includes('name_en')) {
        map.setLayoutProperty(layer.id, 'text-field', ['coalesce', ['get', 'name:es'], ['get', 'name']]);
      }
    }
  };

  // Detect an all-transparent/uniform capture (what you get when reading a cleared buffer).
  function isBlank(canvas) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const g = c.getContext('2d'); g.drawImage(canvas, 0, 0, 64, 64);
    const d = g.getImageData(0, 0, 64, 64).data; const first = d.slice(0, 4).join();
    for (let i = 4; i < d.length; i += 4) if (d.slice(i, i + 4).join() !== first) return false;
    return true;
  }

  PROOF.webgl = function () {
    const gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
    if (!gl) return { ok: false };
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return { ok: true, version: gl.getParameter(gl.VERSION),
      renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE), maxRenderbuffer: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) };
  };

  // fetch() probes from this file:// page (Origin: null).
  PROOF.probe = async function (name, url, init) {
    const t0 = performance.now();
    try {
      const r = await fetch(url, init);
      const text = await r.text();
      return { name, ok: r.ok, status: r.status, bytes: text.length, ms: Math.round(performance.now() - t0), sample: text.slice(0, 160) };
    } catch (err) {
      return { name, ok: false, error: String(err), ms: Math.round(performance.now() - t0) };
    }
  };
  PROOF.origin = location.origin;
</script>
</body>
</html>
